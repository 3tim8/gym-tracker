<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HG Gym Tracker</title>
    <link rel="manifest" href="manifest.json">

    <!-- Verknüpfung zur separaten CSS-Datei -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>7/11 Gym Tracker</h1>
    <div class="grid" id="device-grid"></div>

    <!-- Detail/Eingabe Fenster (Modal) -->
    <div class="modal" id="details-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modal-title">Gerätename</h2>
            <div id="modal-meta"></div>
            
            <span class="days-ago" id="last-trained-days">Noch nie trainiert</span>

            <!-- Formular für neuen Eintrag -->
            <form id="workout-form" onsubmit="saveWorkout(event)">
                <input type="hidden" id="active-device-id">
                <div class="form-group">
                    <label>Gewicht (kg) - für alle Sätze</label>
                    <input type="number" id="weight" step="0.5" required placeholder="z.B. 25">
                </div>
                <!-- Bestehendes Sätze-Grid -->
                <div class="form-group">
                    <label>Wiederholungen pro Satz</label>
                    <div class="sets-grid">
                        <div><label>Satz 1</label><input type="number" id="set1" value="12" required></div>
                        <div><label>Satz 2</label><input type="number" id="set2" value="12" required></div>
                        <div><label>Satz 3</label><input type="number" id="set3" value="12" required></div>
                    </div>
                </div>

                <!-- NEU: Das Auswahlfeld für Zusätzliche Infos -->
                <div class="form-group">
                    <label>Zusätzliche Info</label>
                    <select id="additional-info">
                        <option value="kein" selected>kein</option>
                        <option value="eng & weit">eng & weit</option>
                        <option value="eng">eng</option>
                        <option value="weit">weit</option>
                        <option value="Knie & Waden">Knie & Waden</option>
                        <option value="Knie">Knie</option>
                        <option value="Waden">Waden</option>
                    </select>
                </div>                
                <button type="submit" class="save">Eintrag speichern</button>
            </form>

            <h3>Letzte Aktivitäten:</h3>
            <div class="history-list" id="history-container"></div>
        </div>
    </div>

    <!-- Verknüpfung zur separaten JavaScript-Datei -->
    <script src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>

</body>
</html>
